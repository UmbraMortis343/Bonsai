name: Android

# Builds Bonsai for Android (android/) when its version in android/version.properties changes, and publishes
# Bonsai.apk and Bonsai-Beta.apk as the GitHub release android-v<version>. The app inside updates on its own, as
# the website does; the APK only changes when the Android shell does. The web app's releases (v0.x.y) stay
# "latest"; Android ones never take that.
#
# Signing: every APK must be signed with the same key or the next one won't install over the last. The key lives
# in repo secrets ANDROID_KEYSTORE_B64 (the .p12 file, base64), ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASS. Without them this only builds debug APKs as a workflow artifact and makes no release, so a
# throwaway key never reaches his phone.
on:
  push:
    branches: [main, beta]
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          v=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "android-v$v" >/dev/null 2>&1; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$KS" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - uses: actions/setup-java@v4
        if: steps.v.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.needed == 'true'
      - name: Build the signed APKs
        if: steps.v.outputs.needed == 'true' && steps.v.outputs.signed == 'true'
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/bonsai.p12"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/bonsai.p12"
          ./gradlew --no-daemon assembleLiveRelease assembleBetaRelease
          cp app/build/outputs/apk/live/release/app-live-release.apk Bonsai.apk
          cp app/build/outputs/apk/beta/release/app-beta-release.apk Bonsai-Beta.apk
          rm -f "$RUNNER_TEMP/bonsai.p12"
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      - name: Build debug APKs (no signing key in the secrets)
        if: steps.v.outputs.needed == 'true' && steps.v.outputs.signed != 'true'
        run: |
          ./gradlew --no-daemon assembleLiveDebug assembleBetaDebug
          cp app/build/outputs/apk/live/debug/app-live-debug.apk Bonsai-debug.apk
          cp app/build/outputs/apk/beta/debug/app-beta-debug.apk Bonsai-Beta-debug.apk
          echo "::warning::No signing key in the repo secrets: built debug APKs only, no release. See the comment at the top of android.yml."
      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.needed == 'true' && steps.v.outputs.signed != 'true'
        with:
          name: bonsai-android-debug-${{ steps.v.outputs.version }}
          path: android/*-debug.apk
      - name: Release
        if: steps.v.outputs.needed == 'true' && steps.v.outputs.signed == 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          SUM=$(sha256sum Bonsai.apk | cut -d' ' -f1)
          SUMB=$(sha256sum Bonsai-Beta.apk | cut -d' ' -f1)
          {
            echo "Bonsai for Android. On the phone, download **Bonsai.apk** and open it. Android asks once to let the browser install apps: allow it, then Install. Updates install over it the same way, keeping your data."
            echo
            echo "It opens the live Bonsai, which keeps itself up to date as the website does. **Bonsai-Beta.apk** is a second app that opens the beta, with its own data."
            echo
            echo "On the phone: reminders for Today (Today → Reminders), a Today widget for the home screen, and Share → Bonsai from any app."
            echo
            echo "Data in the app starts empty: sign in to Sync (Menu → Sync devices) to bring everything over."
            echo
            echo "SHA-256: Bonsai.apk \`$SUM\`, Bonsai-Beta.apk \`$SUMB\`"
          } > notes.md
          gh release create "android-v$V" Bonsai.apk Bonsai-Beta.apk --title "Bonsai Android $V" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
        env:
          GH_TOKEN: ${{ github.token }}

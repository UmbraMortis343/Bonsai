name: Release

# Publishes Bonsai when package.json has a version that hasn't been released yet
# (no git tag v<version>). Each release: build, publish to GitHub Pages, then tag
# the commit and create a GitHub release with that version's CHANGELOG notes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released, nothing to do"
          else
            grep -q "^## $v " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $v' entry"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Releasing v$v"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  tag:
    needs: [check, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n**Install or update:** https://%s.github.io/%s/\n' "${GITHUB_REPOSITORY_OWNER,,}" "${GITHUB_REPOSITORY#*/}" >> notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "Bonsai $V" --notes-file notes.md

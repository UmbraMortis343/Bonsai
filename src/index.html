<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonsai</title>
<meta name="description" content="Grow a forest of linked notes.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="update" id="updateBar" role="status" hidden>
  <span id="updateText"></span>
  <button class="btn primary" id="updateBtn">Update</button>
</div>
<div id="app">
  <div class="stage" id="stage"><canvas id="gl" aria-label="Forest"></canvas><div class="labels"></div></div>
  <div class="isles" id="isles" hidden><canvas id="sky" aria-hidden="true"></canvas><canvas id="igl" aria-label="Garden"></canvas><div class="tags" id="tags"></div></div>
  <div class="tech" id="tech" hidden></div>
  <header class="top" id="top"></header>
  <aside class="panel gp" id="gpanel" aria-label="Garden" hidden></aside>
  <div class="picker" id="picker" hidden></div>
  <div class="empty" id="empty" hidden></div>
  <div class="status" id="status" role="status" hidden></div>
  <aside class="panel" id="panel" aria-label="Details" hidden></aside>
  <div class="review" id="review" hidden></div>
  <div class="timeline" id="timeline" hidden></div>
  <div class="actions" id="actions" hidden></div>
  <div class="hover" id="hover" hidden></div>
  <div id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>
<script src="app.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonsai</title>
<meta name="description" content="Grow a forest of linked notes.">
<meta name="theme-color" content="#1c3a2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>Bonsai</span></div>
  <button class="btn ghost" id="installBtn" hidden>Install app</button>
</header>

<div class="update" id="updateBar" role="status" hidden>
  <span id="updateText">A new version is ready.</span>
  <button class="btn primary" id="updateBtn">Update</button>
</div>

<main id="view" class="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="foot">
  <span>Version <b id="ver">__VERSION__</b></span>
  <button class="link" id="checkBtn">Check for updates</button>
  <a class="link" href="https://github.com/UmbraMortis343/Bonsai/releases" target="_blank" rel="noopener">What's new</a>
  <span id="checkMsg" aria-live="polite"></span>
  <span class="sep"></span>
  <button class="link" id="exportBtn">Export backup</button>
  <button class="link" id="importBtn">Restore backup</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</footer>
<script src="app.js"></script>
<script type="module" src="ui.js"></script>
</body>
</html>
